<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>csv-column-mapper demo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 2h7l3 3v9H3z' fill='none' stroke='%23888' stroke-width='1.4'/><path d='M6 8h4M6 11h4' stroke='%23888' stroke-width='1.4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1>csv-column-mapper <small id="model">typesafe/jev</small></h1>

  <!-- 1 ------------------------------------------------------------------- -->
  <section class="step">
    <p class="lead"><span class="num">1</span>Destination table</p>
    <div class="cards" id="schemas"></div>
  </section>

  <!-- 2 ------------------------------------------------------------------- -->
  <section class="step">
    <p class="lead"><span class="num">2</span>The file<em id="dragHint">drag a sample in, or drop your own</em></p>
    <div class="dropzone" id="drop">
      <div class="dz-idle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/>
        </svg>
        <span>Drop a CSV here</span>
      </div>
      <div class="dz-file" hidden>
        <strong id="fname"></strong><span id="fmeta"></span>
        <button class="ghost" id="clear" type="button">Clear</button>
      </div>
    </div>
    <div class="samples" id="samples"></div>
  </section>

  <!-- 3 ------------------------------------------------------------------- -->
  <section class="step" id="resultStep" hidden>
    <p class="lead"><span class="num">3</span>Mapping<em id="stats"></em></p>
    <div id="result"></div>
  </section>

  <p class="err" id="err" hidden></p>
</main>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <header><strong id="mTitle"></strong>
      <button class="ghost" id="mClose" type="button" aria-label="Close">✕</button></header>
    <div class="tablewrap" id="mBody"></div>
    <footer><span id="mMeta"></span><span class="tip" id="mTip"></span></footer>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
