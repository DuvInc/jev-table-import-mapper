name: CI

# Pull requests only get the default read-only token, and nothing here needs
# more. No secret is referenced, and `pull_request` (never
# `pull_request_target`) means a fork's code cannot reach one.
#
# Note what CI does NOT do: map anything. That costs money per run, and the
# tests cover the parts that decide what a mapping looks like, which is where
# the bugs are.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm test
      # The demo must at least boot without a key. A syntax error in a module
      # that only loads at request time is otherwise found by somebody
      # following the README.
      - run: node --check demo/server.mjs && node --check demo/public/app.js
