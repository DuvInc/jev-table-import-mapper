name: Feature request
description: Something this tool should be able to do and cannot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, not the solution.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not need a new npm dependency, or I have said why it does.
        - label: This belongs in the library rather than in the demo, or I have said why it does not.
